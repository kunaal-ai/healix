[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healix-ai"
version = "0.1.0"
description = "An autonomous self-healing agent for Playwright tests with RCA."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0"
]

[project.scripts]
healix = "healix.engine:main"
